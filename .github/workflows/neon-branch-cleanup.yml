name: Neon preview branch cleanup

# The Vercel integration creates a Neon branch named preview/<git branch> for every pull request
# preview, and only deletes it when Vercel deletes the deployment, which rarely happens. The Free
# plan allows 10 branches, so this removes a pull request's branch as soon as it is merged or closed.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
